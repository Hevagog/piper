name: Release Wheel

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Hatch
        run: pip install hatch

      - name: Build
        run: hatch build

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.whl
