[project]
name = "piper"
version = "1.1.0"
description = "Distributed image processing pipeline for machine learning datasets"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "opencv-python>=4.10.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "platformdirs"
]

[project.optional-dependencies]
kaggle = ["kaggle>=1.6.0"]
huggingface = ["datasets>=2.14.0", "huggingface-hub>=0.17.0"]

spark = ["pyspark>=3.5.0"]
luigi = ["luigi>=3.5.0", "requests>=2.31.0"]

webdataset = ["webdataset>=0.2.0"]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

all = [
    "piper[kaggle,huggingface,spark,luigi,webdataset]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["piper"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=piper --cov-report=term-missing"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
